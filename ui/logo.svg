<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1f86"/>
      <stop offset="0.55" stop-color="#1c1046"/>
      <stop offset="1" stop-color="#0e0a1f"/>
    </linearGradient>
    <radialGradient id="glowM" cx="0.22" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#ff4fd2" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff4fd2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.85" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#3fd8ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#3fd8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="drop" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffb3ef"/>
      <stop offset="0.35" stop-color="#ff4fd2"/>
      <stop offset="1" stop-color="#6a45ff"/>
    </linearGradient>
    <radialGradient id="dropShade" cx="0.5" cy="0.75" r="0.6">
      <stop offset="0.55" stop-color="#2a0f6e" stop-opacity="0"/>
      <stop offset="1" stop-color="#2a0f6e" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9f4ff"/>
      <stop offset="0.45" stop-color="#3fd8ff"/>
      <stop offset="1" stop-color="#2160c8"/>
    </linearGradient>
    <filter id="blur24" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="tileClip"><rect x="64" y="64" width="896" height="896" rx="236"/></clipPath>
  </defs>

  <!-- frosted tile -->
  <g clip-path="url(#tileClip)">
    <rect x="64" y="64" width="896" height="896" fill="url(#tile)"/>
    <rect x="64" y="64" width="896" height="896" fill="url(#glowM)"/>
    <rect x="64" y="64" width="896" height="896" fill="url(#glowC)"/>
    <path d="M64 64 H960 V420 C760 360 300 360 64 470 Z" fill="url(#sheen)"/>
  </g>
  <rect x="66" y="66" width="892" height="892" rx="234" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="4"/>

  <!-- tray (the archive) -->
  <ellipse cx="512" cy="790" rx="250" ry="40" fill="#3fd8ff" opacity=".45" filter="url(#blur24)"/>
  <rect x="262" y="726" width="500" height="112" rx="56" fill="url(#tray)"/>
  <rect x="262" y="726" width="500" height="112" rx="56" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="5"/>
  <rect x="300" y="738" width="424" height="34" rx="17" fill="#fff" opacity=".55"/>

  <!-- droplet shadow on tray -->
  <ellipse cx="512" cy="732" rx="150" ry="22" fill="#0b0520" opacity=".55" filter="url(#blur10)"/>

  <!-- droplet -->
  <path d="M512 132 C470 214 300 392 300 520 A212 212 0 0 0 724 520 C724 392 554 214 512 132 Z" fill="url(#drop)"/>
  <path d="M512 132 C470 214 300 392 300 520 A212 212 0 0 0 724 520 C724 392 554 214 512 132 Z" fill="url(#dropShade)"/>
  <path d="M512 132 C470 214 300 392 300 520 A212 212 0 0 0 724 520 C724 392 554 214 512 132 Z" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="5"/>
  <ellipse cx="420" cy="420" rx="52" ry="92" transform="rotate(28 420 420)" fill="#fff" opacity=".55" filter="url(#blur10)"/>
  <ellipse cx="404" cy="400" rx="16" ry="34" transform="rotate(28 404 400)" fill="#fff" opacity=".9"/>

  <!-- download arrow -->
  <g stroke="#fff" stroke-width="58" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M512 404 V604"/>
    <path d="M428 528 L512 612 L596 528"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
